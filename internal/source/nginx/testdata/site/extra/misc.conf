server {
    listen 8443 ssl;
    server_name *.example.com ~^api\d+\.example\.com$ _ wild.example.org;
    limit_req zone=perip burst=10;
    fastcgi_pass unix:/run/php.sock;
}

server {
    listen 127.0.0.1:8080;
    server_name lan.example.net;
    deny 198.51.100.0/24;
    allow all;
    location / { grpc_pass grpc://192.0.2.30:50051; }
    location /x { fastcgi_pass 192.0.2.31:9000; }
}

server {
    server_name nolisten.example.org;
    if ($scheme = http) { return 308 https://$host$request_uri; }
    location / { proxy_pass http://$upstream_var; }
}

server {
    listen 9000;
    server_name both.example.org;
    allow 203.0.113.0/24;
    deny all;
    satisfy any;
    auth_basic "x";
    location / { proxy_pass http://192.0.2.40:80; }
}
