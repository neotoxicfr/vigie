# Redirection HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    listen 443 quic reuseport;
    server_name app.example.com;
    add_header Strict-Transport-Security "max-age=63072000" always;

    location / { proxy_pass http://app; }
    location /admin/ {
        allow 192.0.2.0/24;
        allow 2001:db8::/32;
        deny all;
        proxy_pass http://192.0.2.12:9000;
    }
    location /private/ {
        auth_basic "Zone privée";
        auth_basic_user_file /etc/nginx/htpasswd;
        proxy_pass http://192.0.2.13:9000/;
    }
    location /sso/ {
        auth_request /auth;
        proxy_pass http://192.0.2.14:9000;
    }
    location = /auth {
        internal;
        proxy_pass http://192.0.2.20:9091/api/verify;
    }
    location ~ ^/regex/ {
        deny all;
    }
    location /open/ {
        auth_basic off;
        proxy_pass http://192.0.2.15:9000;
    }
}
