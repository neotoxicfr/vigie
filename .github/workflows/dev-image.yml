name: Image dev

# ghcr.io/<compte>/vigie:dev suit la branche dev (la prod maison la suit) ; pas d'image :main.
# Une fusion faite par le jeton intégré (fusion automatique) ne déclenche pas « push » : on part donc aussi
# de la fin de la CI d'une PR vers dev, on attend que la PR soit fusionnée, puis on construit depuis dev.
# Le code de la PR n'est jamais extrait : seulement dev, une fois la fusion faite.
on:
  push:
    branches: [dev]
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions: {}

jobs:
  image:
    # Concurrence au niveau de la tâche : une exécution sautée (CI sans rapport avec dev) n'annule plus une
    # publication en cours ; les publications passent l'une après l'autre, la plus récente construit la tête de dev.
    concurrency:
      group: dev-image
      cancel-in-progress: false
    if: >-
      github.event_name == 'push' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'pull_request' &&
       github.event.workflow_run.pull_requests[0].base.ref == 'dev')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      packages: write      # push sur ghcr.io
      id-token: write      # attestation de provenance (Sigstore)
      attestations: write
    steps:
      - name: Attendre la fusion de la PR
        if: github.event_name == 'workflow_run'
        id: merged
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          for _ in $(seq 1 30); do
            state=$(gh pr view "$PR" --json state --jq .state)
            if [ "$state" = MERGED ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; exit 0; fi
            if [ "$state" = CLOSED ]; then break; fi
            sleep 20
          done
          echo "PR #$PR non fusionnée : rien à publier."
          echo "ok=false" >> "$GITHUB_OUTPUT"
      - if: github.event_name == 'push' || steps.merged.outputs.ok == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dev
          persist-credentials: false
      - id: sha
        if: github.event_name == 'push' || steps.merged.outputs.ok == 'true'
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - if: github.event_name == 'push' || steps.merged.outputs.ok == 'true'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - if: github.event_name == 'push' || steps.merged.outputs.ok == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: github.event_name == 'push' || steps.merged.outputs.ok == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        if: github.event_name == 'push' || steps.merged.outputs.ok == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=dev-${{ steps.sha.outputs.sha }}
          tags: |
            ghcr.io/${{ github.repository }}:dev
            ghcr.io/${{ github.repository }}:dev-${{ steps.sha.outputs.sha }}
          cache-from: type=gha
          # Après une CI de PR (workflow_run), le jeton n'a pas le droit d'écrire le cache : sans effet sur l'image.
          cache-to: type=gha,mode=max,ignore-error=true
      - if: github.event_name == 'push' || steps.merged.outputs.ok == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          create-storage-record: false # réservé aux dépôts d'organisation
