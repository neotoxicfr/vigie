name: Fusion automatique

# PR de Dependabot vers dev : fusion dès que les contrôles obligatoires sont verts (la CI suffit).
# Ses mises à jour de sécurité, qui visent toujours main, sont ramenées sur dev d'abord.
# PR du propriétaire : armée seulement par une vraie revue CodeRabbit (revue.yml) ; un nouveau commit la désarme.
# Jamais de fusion automatique sur main. Aucun code de la PR n'est extrait ni exécuté ici.
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions: {}

jobs:
  dependabot:
    if: >-
      !github.event.pull_request.draft && github.event.pull_request.user.login == 'dependabot[bot]' &&
      (github.event.pull_request.base.ref == 'dev' || github.event.pull_request.base.ref == 'main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.html_url }}
      BASE: ${{ github.event.pull_request.base.ref }}
    steps:
      - if: env.BASE == 'main'
        run: gh pr edit "$PR" --base dev
      - run: gh pr merge "$PR" --auto --squash

  desarmer:
    # Le nouveau commit n'est pas encore relu : la fusion attendra la prochaine revue.
    if: github.event.action == 'synchronize' && github.event.pull_request.user.login == github.repository_owner && github.event.pull_request.auto_merge != null
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.html_url }}
        run: gh pr merge "$PR" --disable-auto
