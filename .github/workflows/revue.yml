name: Revue CodeRabbit

# PR du propriétaire vers dev : la fusion automatique n'est armée que par une vraie revue publiée par
# coderabbitai[bot] sur le commit de tête. Revue sautée (quota, siège, erreur) : rien n'est armé, la PR
# reste ouverte ; la relance programmée redemande la revue une seule fois par PR. Dependabot n'est pas relu.
on:
  pull_request_review:
    types: [submitted]
  schedule:
    - cron: '41 */3 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  armer:
    if: >-
      github.event_name == 'pull_request_review' && github.event.review.user.login == 'coderabbitai[bot]' &&
      github.event.review.commit_id == github.event.pull_request.head.sha &&
      github.event.pull_request.user.login == github.repository_owner &&
      github.event.pull_request.base.ref == 'dev' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.html_url }}
      HEAD: ${{ github.event.pull_request.head.ref }}
    steps:
      # main → dev (synchronisation) : commit de fusion, pour que dev contienne main.
      - run: |
          if [ "$HEAD" = main ]; then gh pr merge "$PR" --auto --merge; else gh pr merge "$PR" --auto --squash; fi

  relance:
    if: github.event_name != 'pull_request_review'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      OWNER: ${{ github.repository_owner }}
    steps:
      - run: |
          marque='<!-- vigie:relance-coderabbit -->'
          gh pr list --base dev --state open --author "$OWNER" --json number,headRefOid,createdAt,isDraft \
            --jq '.[] | select(.isDraft | not) | select((now - (.createdAt | fromdateiso8601)) > 3600) | "\(.number) \(.headRefOid)"' |
          while read -r n sha; do
            relu=$(gh api "repos/$GH_REPO/pulls/$n/reviews" --jq "[.[] | select(.user.login == \"coderabbitai[bot]\" and .commit_id == \"$sha\")] | length")
            [ "$relu" -gt 0 ] && continue
            deja=$(gh api "repos/$GH_REPO/issues/$n/comments" --jq "[.[] | select(.body | contains(\"$marque\"))] | length")
            [ "$deja" -gt 0 ] && continue
            gh pr comment "$n" --body "@coderabbitai review
          $marque"
          done
