version: 2
# Tout arrive sur dev (fusion automatique si les contrôles passent) ; main ne bouge qu'aux releases.
# Mineures et correctifs groupés par écosystème ; une majeure garde sa propre PR. Aucun délai de publication.
updates:
  - package-ecosystem: gomod
    directory: /
    target-branch: dev
    cooldown:
      exclude: ["*"]   # aucun délai (Dependabot en applique 3 jours par défaut)
    schedule:
      interval: daily
    groups:
      go:
        update-types: [minor, patch]
    commit-message:
      prefix: build(deps)

  - package-ecosystem: docker
    directory: /
    target-branch: dev
    cooldown:
      exclude: ["*"]   # aucun délai (Dependabot en applique 3 jours par défaut)
    schedule:
      interval: daily
    groups:
      docker:
        update-types: [minor, patch]
    commit-message:
      prefix: build(docker)

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    cooldown:
      exclude: ["*"]   # aucun délai (Dependabot en applique 3 jours par défaut)
    schedule:
      interval: daily
    groups:
      actions:
        update-types: [minor, patch]
    commit-message:
      prefix: ci
